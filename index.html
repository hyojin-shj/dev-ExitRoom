<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<meta name="description" content="개발자라면 등골이 서늘해지는 방탈출. API 비용 폭탄, 금요일 DROP TABLE, 퇴사자의 유령 커밋.">
<meta property="og:title" content="DEV EXIT ROOM — 개발자 스릴러 방탈출">
<meta property="og:description" content="개발자라면 등골이 서늘해지는 방탈출 3편. 당신은 몇 분 만에 탈출할 수 있나요?">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEV EXIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>DEV EXIT ROOM — 개발자 스릴러 방탈출</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2">
<style>
body{background:radial-gradient(ellipse at 50% -10%,#1a0d18 0%,var(--bg) 55%)}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + var(--sat)) 16px calc(40px + var(--sab))}
header{text-align:center;margin-bottom:26px}
.logo{font-family:var(--mono);font-weight:700;font-size:clamp(30px,9vw,52px);letter-spacing:-1px;line-height:1}
.logo span{color:var(--acc);text-shadow:0 0 24px #ff4d5e88}
.logo .cur{display:inline-block;width:.5em;height:.9em;background:var(--acc);vertical-align:-.1em;margin-left:4px;animation:blink 1s steps(1) infinite}
header p{color:var(--dim);font-size:14px;margin-top:10px;word-break:keep-all}
.sec-title{font-size:13px;color:var(--dim);margin:30px 0 10px;letter-spacing:1px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:7px 12px;border-radius:20px;white-space:nowrap}
.tabs button.on{color:var(--txt);border-color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tip{font-size:12px;color:var(--dim);line-height:1.7;margin-top:26px;text-align:center;word-break:keep-all}
.soon{border-style:dashed;opacity:.6;justify-content:center;text-align:center;color:var(--dim);font-size:13px;padding:22px}
.soon::before{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">DEV<span>_</span>EXIT<span class="cur"></span></div>
    <p>개발자라면 등골이 서늘해지는 방탈출.</p>
  </header>

  <div class="rooms" id="rooms"></div>

  <div class="sec-title" id="lbTitle">🏆 명예의 전당 · TRUE END 최단 기록</div>
  <div class="tabs" id="tabs"></div>
  <div class="panel lb" id="board"><p class="lbmsg">불러오는 중…</p></div>

  <p class="tip">📱 모바일에서는 공유 버튼 → <b>홈 화면에 추가</b>하면 앱처럼 전체 화면으로 즐길 수 있어요.<br>진행 기록은 이 기기에 저장됩니다.</p>
</div>
<script src="assets/engine.js?v=2"></script>
<script>
const {ROOMS,store,api,fmt}=ER;
// First visit: go straight into ROOM 01's intro. The list appears once ROOM 01 is cleared.
if(!ER.unlocked())location.replace('rooms/ep1.html');
const list=document.getElementById('rooms');
ROOMS.forEach(r=>list.appendChild(ER.roomCard(r,'rooms/'+r.id+'.html')));
list.insertAdjacentHTML('beforeend','<div class="room soon">🚧 ROOM 04 · 준비 중… (다음 사건을 기다려 주세요)</div>');

const tabs=document.getElementById('tabs');let cur='ep1';
ROOMS.forEach(r=>{const b=document.createElement('button');b.textContent=r.icon+' '+r.title;b.dataset.id=r.id;b.onclick=()=>{cur=r.id;draw()};tabs.appendChild(b)});
async function draw(){
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===cur));
  const el=document.getElementById('board');el.innerHTML='<p class="lbmsg">불러오는 중…</p>';
  const d=await api.scores(cur);
  if(!d){['lbTitle','tabs','board'].forEach(i=>document.getElementById(i).style.display='none');return}
  if(!d.rows.length){el.innerHTML='<p class="lbmsg">아직 탈출한 사람이 없어요. 첫 번째 탈출자가 되어 보세요!</p>';return}
  const me=store.get('nick','');
  const t=document.createElement('table');t.innerHTML='<tr><th>#</th><th>닉네임</th><th>시간</th><th>힌트</th></tr>';
  d.rows.forEach((r,i)=>{const tr=document.createElement('tr');if(me&&r.nick===me)tr.className='me';
    [['rk',i<3?['🥇','🥈','🥉'][i]:i+1],['',r.nick],['mono',fmt(r.sec)],['mono',r.hints+'회']].forEach(([c,v])=>{const td=document.createElement('td');td.className=c;td.textContent=v;tr.appendChild(td)});t.appendChild(tr)});
  el.innerHTML='';const w=document.createElement('div');w.className='tbl';w.appendChild(t);el.appendChild(w);
  const n=document.createElement('p');n.className='lbmsg';n.style.marginTop='8px';n.textContent=`총 ${d.total}명 탈출`;el.appendChild(n);
}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
